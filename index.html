<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="速度YouTube">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>速度つきYouTubeプレーヤー</title>
<style>
  :root { --fg:#eee; --acc:#ff3d3d; --glass:rgba(20,20,20,.45); --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:var(--fg); font:15px/1.5 system-ui,"Yu Gothic UI",sans-serif; }
  #stage { position:fixed; inset:0; width:100vw; height:100dvh; background:#000; user-select:none; -webkit-user-select:none; }
  #player, #player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #shield { position:absolute; inset:0; z-index:2; touch-action:manipulation; }

  /* 操作UI: タップで出現、数秒で自動的に消える */
  #ui { position:absolute; inset:0; z-index:3; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;
        padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
        transition:opacity .25s; }
  #ui > * { pointer-events:auto; }
  #stage.hide #ui { opacity:0; }
  #stage.hide #ui > * { pointer-events:none; }
  #stage.hide { cursor:none; }

  form { display:flex; gap:8px; }
  input[type=text] { flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--glass); color:#fff; font-size:16px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  input[type=text]::placeholder { color:#bbb; }
  button { cursor:pointer; touch-action:manipulation; border:1px solid var(--line); background:var(--glass); color:#fff; border-radius:10px; padding:8px 14px; font-size:15px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  button.on { background:var(--acc); border-color:var(--acc); font-weight:600; }
  #msg { color:#ff9a9a; font-size:13px; text-shadow:0 1px 3px #000; min-height:0; }

  #bottom { display:flex; flex-direction:column; gap:8px; }
  .speeds { display:flex; flex-wrap:wrap; gap:6px; opacity:.6; }  /* 薄く表示 */
  .speeds button { flex:1 0 12%; padding:10px 0; }
  #bar { display:flex; align-items:center; gap:8px; }
  #bar button { border:none; background:none; font-size:22px; padding:4px 8px; backdrop-filter:none; -webkit-backdrop-filter:none; text-shadow:0 1px 4px #000; }
  #seek { flex:1; accent-color:var(--acc); height:28px; }
  #vol { width:80px; accent-color:var(--acc); }
  #time { font-variant-numeric:tabular-nums; font-size:13px; min-width:96px; text-align:center; text-shadow:0 1px 4px #000; }

  /* フィードバック表示(速度・10秒移動など) */
  #badge { position:absolute; z-index:4; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.65); padding:8px 20px; border-radius:30px; font-size:22px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #badge.show { opacity:1; }
  #badge.left { left:18%; } #badge.right { left:82%; }

  #empty { position:absolute; z-index:1; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#888; padding:24px; pointer-events:none; }
  #stage.loaded #empty { display:none; }

  @media (pointer:coarse) { #vol, #mute { display:none; } }  /* 音量は端末のボタンで */
  @media (max-width:520px) { .speeds button { flex:1 0 20%; } #time { min-width:80px; font-size:12px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="player"></div>
  <div id="empty">URLまたは動画IDを入力して「再生」<br>(画面をタップで操作パネルを表示)</div>
  <div id="shield"></div>
  <div id="badge">1x</div>

  <div id="ui">
    <div id="top">
      <form id="f">
        <input type="text" id="url" placeholder="YouTubeのURL または 動画ID" autocomplete="off" autocapitalize="off">
        <button type="button" id="paste" title="コピーしたURLを貼り付けて再生">貼付</button>
        <button type="submit">再生</button>
      </form>
      <div id="msg"></div>
    </div>
    <div id="bottom">
      <div class="speeds" id="speeds"></div>
      <div id="bar">
        <button id="pp" title="再生/停止 (Space)">▶</button>
        <span id="time">0:00 / 0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0">
        <button id="cc" title="字幕 (C)" style="font-size:15px;font-weight:700">字幕</button>
        <button id="mute" title="ミュート (M)">🔊</button>
        <input type="range" id="vol" min="0" max="100" value="100">
        <button id="fs" title="全画面 (F)">⛶</button>
      </div>
    </div>
  </div>
</div>

<script>
const RATES = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
const PRESET_KEYS = { '1':0.5, '2':0.75, '3':1, '4':1.25, '5':1.5, '6':1.75, '7':2 };
const $ = id => document.getElementById(id);
const stage = $('stage');
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
let rate = parseFloat(store.get('rate', '1')) || 1;
let cc = store.get('cc', '1') === '1';
let player, ready = false, badgeTimer, hideTimer, started = false;

/* ---------- 操作UIの表示/自動非表示 ---------- */
function isPlaying(){ return ready && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING; }
function showUI(){
  stage.classList.remove('hide');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (isPlaying() && document.activeElement !== $('url')) stage.classList.add('hide'); }, 4000);
}
function toggleUI(){ stage.classList.contains('hide') ? showUI() : hideUI(); }
function hideUI(){ clearTimeout(hideTimer); if (started) stage.classList.add('hide'); }
stage.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') showUI(); });
$('ui').addEventListener('pointerdown', showUI);   // 操作中は消えないよう延長

/* ---------- 速度 ---------- */
RATES.forEach(r => {
  const b = document.createElement('button');
  b.textContent = r + 'x'; b.dataset.r = r;
  b.onclick = () => setRate(r);
  $('speeds').appendChild(b);
});
function refreshButtons(){
  document.querySelectorAll('#speeds button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.r) === rate));
}
function setRate(r){
  const list = ready && player.getAvailablePlaybackRates ? player.getAvailablePlaybackRates() : RATES;
  rate = Math.min(Math.max(...list), Math.max(Math.min(...list), Math.round(r*100)/100));
  if (ready) player.setPlaybackRate(rate);
  store.set('rate', rate);
  refreshButtons();
  flash(rate + 'x');
}
function stepRate(dir){
  const i = RATES.indexOf(rate) >= 0 ? RATES.indexOf(rate) : RATES.findIndex(r => r >= rate);
  setRate(RATES[Math.min(RATES.length-1, Math.max(0, i + dir))]);
}
function flash(t, side){
  const b = $('badge');
  b.textContent = t; b.className = 'show' + (side ? ' ' + side : '');
  clearTimeout(badgeTimer); badgeTimer = setTimeout(() => b.classList.remove('show'), 700);
}
refreshButtons();

/* ---------- YouTube IFrame API ---------- */
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    playerVars: { controls:0, disablekb:1, rel:0, playsinline:1, modestbranding:1, fs:0, hl:'ja', cc_lang_pref:'ja', cc_load_policy: cc ? 1 : 0 },
    events: {
      onReady: () => {
        ready = true;
        const sp = new URLSearchParams(location.search);
        const q = sp.get('url') || sp.get('v') || sp.get('text');   // 共有(Share Target)・ショートカット経由の受け取り
        if (q) load(q);
      },
      onStateChange: e => {
        $('pp').textContent = e.data === YT.PlayerState.PLAYING ? '⏸' : '▶';
        if (e.data === YT.PlayerState.PLAYING) { player.setPlaybackRate(rate); applyCC(); showUI(); }
        else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) { clearTimeout(hideTimer); stage.classList.remove('hide'); }
      },
      onError: e => { $('msg').textContent = '再生できません (エラー ' + e.data + ')。埋め込みが禁止されている動画の可能性があります。'; stage.classList.remove('hide'); }
    }
  });
};

/* ---------- 字幕 ---------- */
function applyCC(){
  if (!ready) return;
  try { cc ? player.loadModule('captions') : player.unloadModule('captions'); } catch {}
  $('cc').style.opacity = cc ? 1 : .45;
}
function toggleCC(){ cc = !cc; store.set('cc', cc ? '1' : '0'); applyCC(); flash(cc ? '字幕 ON' : '字幕 OFF'); }
$('cc').onclick = toggleCC;
$('cc').style.opacity = cc ? 1 : .45;

function parse(input){
  const m0 = (input || '').match(/https?:\/\/[^\s]+/);   // 「タイトル https://youtu.be/…」のような共有テキストからURLを抜き出す
  input = (m0 ? m0[0] : input || '').trim();
  if (/^[\w-]{11}$/.test(input)) return { v: input };
  try {
    const u = new URL(input);
    const list = u.searchParams.get('list');
    let v = u.searchParams.get('v');
    if (u.hostname === 'youtu.be') v = u.pathname.slice(1);
    const m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/); if (m) v = m[2];
    if (v || list) return { v, list };
  } catch {}
  return null;
}
function load(input){
  $('msg').textContent = '';
  const p = parse(input);
  if (!p) { $('msg').textContent = 'URLまたは動画IDを認識できませんでした。'; return; }
  if (!ready) return;
  if (p.v) player.loadVideoById(p.v);
  else player.loadPlaylist({ list: p.list, listType: 'playlist' });
  player.setPlaybackRate(rate);
  started = true; stage.classList.add('loaded');
  const q = new URLSearchParams(); if (p.v) q.set('v', p.v);
  history.replaceState(null, '', '?' + q);
}
$('paste').onclick = async () => {
  try { const t = await navigator.clipboard.readText(); $('url').value = t; load(t); showUI(); }
  catch { $('msg').textContent = 'クリップボードを読めませんでした。入力欄に長押しで貼り付けてください。'; }
};
$('f').onsubmit =e => { e.preventDefault(); load($('url').value); $('url').blur(); showUI(); };

/* ---------- 操作 ---------- */
const fmt = t => { t = Math.floor(t||0); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
function toggle(){ if(!ready) return; isPlaying() ? player.pauseVideo() : player.playVideo(); }
function seekBy(d, side){ if(!ready) return; player.seekTo(Math.max(0, player.getCurrentTime() + d), true); flash((d>0?'+':'−') + Math.abs(d) + '秒', side); }
function setVol(v){ if(!ready) return; v = Math.min(100, Math.max(0, v)); player.setVolume(v); player.unMute(); $('vol').value = v; $('mute').textContent = v ? '🔊' : '🔇'; flash('音量 ' + v); }
function toggleMute(){ if(!ready) return; if (player.isMuted()) { player.unMute(); $('mute').textContent='🔊'; } else { player.mute(); $('mute').textContent='🔇'; } }
const fsReq = stage.requestFullscreen || stage.webkitRequestFullscreen;
function fs(){
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (fsReq) fsReq.call(stage);
}
if (!fsReq) $('fs').style.display = 'none';   // iPhoneなど。画面は常に全面表示済み

$('pp').onclick = toggle; $('mute').onclick = toggleMute; $('fs').onclick = fs;
$('vol').oninput = e => setVol(+e.target.value);
let dragging = false;
$('seek').oninput = e => { dragging = true; if (ready) $('time').textContent = fmt(e.target.value/1000*player.getDuration()) + ' / ' + fmt(player.getDuration()); };
$('seek').onchange = e => { if (ready) player.seekTo(e.target.value/1000*player.getDuration(), true); dragging = false; e.target.blur(); };
setInterval(() => {
  if (!ready || !player.getDuration || dragging) return;
  const d = player.getDuration(), c = player.getCurrentTime();
  if (d) { $('seek').value = c/d*1000; $('time').textContent = fmt(c) + ' / ' + fmt(d); }
}, 250);

/* ---------- タップ操作 (本家と同じ) ----------
   1回タップ: 操作パネルの表示/非表示
   左/右ダブルタップ: 10秒戻す/進める (続けてタップすると連続で移動)
   中央ダブルタップ: 再生/停止 */
let lastTap = 0, tapTimer = null;
$('shield').addEventListener('pointerup', e => {
  const now = Date.now(), x = e.clientX / stage.clientWidth;
  if (now - lastTap < 320) {
    clearTimeout(tapTimer); lastTap = now;
    if (x < 0.35) { seekBy(-10, 'left'); }
    else if (x > 0.65) { seekBy(10, 'right'); }
    else toggle();
    return;
  }
  lastTap = now;
  tapTimer = setTimeout(toggleUI, 320);
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key; let hit = true;
  if (k === ' ' || k === 'k') toggle();
  else if (k === 'ArrowLeft') seekBy(-5);
  else if (k === 'ArrowRight') seekBy(5);
  else if (k === 'j') seekBy(-10, 'left');
  else if (k === 'l') seekBy(10, 'right');
  else if (k === 'ArrowUp') setVol(player.getVolume() + 5);
  else if (k === 'ArrowDown') setVol(player.getVolume() - 5);
  else if (k === '.' || k === '>') stepRate(1);
  else if (k === ',' || k === '<') stepRate(-1);
  else if (k === 'r') setRate(1);
  else if (k === 'f') fs();
  else if (k === 'm') toggleMute();
  else if (k === 'c') toggleCC();
  else if (k === '0') setRate(2);
  else if (PRESET_KEYS[k]) setRate(PRESET_KEYS[k]);
  else hit = false;
  if (hit) { e.preventDefault(); if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); showUI(); }
});
</script>
</body>
</html>
